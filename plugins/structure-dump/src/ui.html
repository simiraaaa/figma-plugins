<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font: 12px/1.6 -apple-system, "Hiragino Sans", sans-serif; margin: 0; padding: 12px; color: #1a1a1a; }
  h2 { font-size: 13px; margin: 12px 0 4px; }
  .meta { color: #777; font-size: 11px; }
  .warn { color: #a15c00; margin: 4px 0 0; }
  .warn summary { cursor: pointer; }
  #warnings-list { white-space: pre-wrap; margin: 2px 0 0; max-height: 200px; overflow: auto; }
  pre { font: 11px/1.5 "SF Mono", Menlo, monospace; background: #f5f5f5; border-radius: 4px; padding: 8px; overflow: auto; max-height: 280px; white-space: pre-wrap; word-break: break-all; }
  button { font-size: 12px; padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; margin-right: 6px; }
  button:hover { background: #f0f0f0; }
  #status { color: #777; }
  #error { color: #c62828; white-space: pre-wrap; }
  #dev-log { white-space: pre-wrap; margin: 4px 0 0; max-height: 360px; overflow: auto; }
</style>
</head>
<body>
  <div id="status">書き出し中…</div>
  <div id="error"></div>
  <div id="app" style="display:none">
    <div class="meta" id="meta"></div>
    <details id="warnings" class="warn" hidden>
      <summary id="warnings-summary"></summary>
      <div id="warnings-list"></div>
    </details>
    <h2>ダウンロード</h2>
    <div>
      <button id="download-zip">ZIPをダウンロード</button>
      <button id="copy-json">index.jsonをコピー</button>
    </div>
    <h2>index.json プレビュー</h2>
    <pre id="json"></pre>
  </div>
  <div id="dev" hidden>
    <h2>開発ループ (dev サーバー: <span id="dev-server"></span>)</h2>
    <div class="meta">dev サーバーの依頼を待ち、書き出した ZIP を送る。プラグインのコードを build し直すと、最後の依頼をもう一度書き出す。</div>
    <div id="dev-log"></div>
  </div>

<script>
let payload = null;
const PREVIEW_LIMIT = 20000;

function setStatus(text) {
  document.getElementById("status").textContent = text;
}

function failureDetail(e) {
  return e instanceof Error ? e.message : String(e);
}

// ---------------------------------------------------------------------------
// 開発ループ (メニューの dev-loop で起動したときだけ動く)
// ポートは manifest の devAllowedDomains と scripts/dev-server-lib.mts の DEV_PORT と同じ値にする
// ---------------------------------------------------------------------------

const DEV_SERVER = "http://localhost:47717";
const DEV_RETRY_MS = 2000;
const DEV_LOG_LINES = 50;
/** 書き出し中の依頼の結果 (dev-result / dev-error) を受け取る */
let devResolve = null;

function devLog(text) {
  const log = document.getElementById("dev-log");
  const lines = log.textContent === "" ? [] : log.textContent.split("\n");
  lines.unshift(`${new Date().toLocaleTimeString()} ${text}`);
  log.textContent = lines.slice(0, DEV_LOG_LINES).join("\n");
}

function devTargets(request) {
  return request.nodeIds ? request.nodeIds.join(", ") : "開いているページの選択 (未選択ならページ直下)";
}

function dumpInPlugin(request) {
  return new Promise((resolve) => {
    devResolve = resolve;
    parent.postMessage({ pluginMessage: { type: "dev-request", request } }, "*");
  });
}

/** fetch の本文は Content-Type を付けない形 (Uint8Array・文字列) にし、CORS の preflight を起こさない */
async function devSend(request, outcome) {
  if (outcome.type === "dev-result") {
    const zip = outcome.payload.zip;
    const bytes = zip instanceof Uint8Array ? zip : new Uint8Array(zip);
    const res = await fetch(`${DEV_SERVER}/result?seq=${request.seq}`, { method: "POST", body: bytes });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    const m = outcome.payload.meta;
    devLog(
      `#${request.seq} を送った: 画面フレーム ${m.frameCount} 枚・ZIP ${(m.zipBytes / 1024).toFixed(0)} KB・警告 ${m.warnings.length} 件`
    );
    return;
  }
  const res = await fetch(`${DEV_SERVER}/error?seq=${request.seq}`, { method: "POST", body: outcome.message });
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
  devLog(`#${request.seq} は書き出せなかった (dev サーバーへ伝えた): ${outcome.message}`);
}

async function devLoop() {
  const startedAt = Date.now();
  let server = null;
  let after = null;
  let offline = false;
  for (;;) {
    let request;
    try {
      const query = server === null ? "" : `?server=${server}&after=${after}`;
      const res = await fetch(`${DEV_SERVER}/next${query}`);
      if (res.status === 204) continue;
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
      request = await res.json();
    } catch (e) {
      if (!offline) {
        devLog(`dev サーバーにつながらない (${failureDetail(e)})。npm run dev:server を起動すると自動でつながる`);
        setStatus("dev サーバーを待っている");
      }
      offline = true;
      await new Promise((resolve) => setTimeout(resolve, DEV_RETRY_MS));
      continue;
    }
    offline = false;
    server = request.server;
    after = request.seq;
    const reason =
      Date.parse(request.requestedAt) < startedAt
        ? "起動・build で走り直したので、最後の依頼をもう一度"
        : "新しい依頼";
    devLog(`#${request.seq} を書き出す (${reason}): ${devTargets(request)}`);
    const outcome = await dumpInPlugin(request);
    try {
      await devSend(request, outcome);
    } catch (e) {
      devLog(`#${request.seq} の送信に失敗: ${failureDetail(e)}`);
    }
    setStatus("依頼を待っている");
  }
}

onmessage = (event) => {
  const msg = event.data.pluginMessage;
  if (!msg) return;

  if (msg.type === "progress") {
    const count = `${msg.done}/${msg.total}`;
    if (msg.phase === "frames") setStatus(`書き出し中… 画面 ${count} ${msg.name}`);
    else if (msg.phase === "sections") setStatus(`書き出し中… セクション ${count}`);
    else if (msg.phase === "assets") setStatus(`書き出し中… 画像 ${count}`);
    return;
  }
  setStatus("");

  if (msg.type === "dev-start") {
    document.getElementById("dev-server").textContent = DEV_SERVER;
    document.getElementById("dev").hidden = false;
    setStatus("依頼を待っている");
    devLoop();
    return;
  }
  if (msg.type === "dev-result" || msg.type === "dev-error") {
    const resolve = devResolve;
    devResolve = null;
    if (resolve) resolve(msg);
    return;
  }

  if (msg.type === "error") {
    document.getElementById("error").textContent = msg.message;
    return;
  }
  if (msg.type !== "result") return;

  payload = msg.payload;
  document.getElementById("app").style.display = "block";

  const m = payload.meta;
  document.getElementById("meta").textContent =
    `${m.fileName} / ${m.scope} / ` +
    `画面フレーム ${m.frameCount} 枚 (スクリーンショット ${m.screenshotCount} 枚・${m.screenshotScale}x) / ` +
    `セクション ${m.sectionCount} 件 / 画像アセット ${m.assetCount} 件 / ` +
    `ZIP ${(m.zipBytes / 1024).toFixed(0)} KB`;

  // 赤は中止 (#error) だけに使い、続行した警告は色と見出しで見分けられるようにする
  if (m.warnings.length > 0) {
    document.getElementById("warnings-summary").textContent =
      `⚠ 警告 ${m.warnings.length} 件 (書き出しは中止せず完了)`;
    document.getElementById("warnings-list").textContent =
      m.warnings.map((w) => `• ${w}`).join("\n");
    document.getElementById("warnings").hidden = false;
  }

  const preview =
    payload.indexText.length > PREVIEW_LIMIT
      ? payload.indexText.slice(0, PREVIEW_LIMIT) + "\n…(省略。全文はZIP内のindex.json)"
      : payload.indexText;
  document.getElementById("json").textContent = preview;
};

document.getElementById("download-zip").onclick = () => {
  try {
    // postMessage 越しに Uint8Array が別形に落ちた場合に備えて包み直す
    const bytes =
      payload.zip instanceof Uint8Array ? payload.zip : new Uint8Array(payload.zip);
    const blob = new Blob([bytes], { type: "application/zip" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = payload.zipName;
    a.click();
    URL.revokeObjectURL(a.href);
    setStatus(`ダウンロードを開始しました: ${payload.zipName}`);
  } catch (e) {
    setStatus(`ダウンロードに失敗しました: ${failureDetail(e)}`);
  }
};

document.getElementById("copy-json").onclick = () => {
  const ta = document.createElement("textarea");
  try {
    ta.value = payload.indexText;
    document.body.appendChild(ta);
    ta.select();
    const copied = document.execCommand("copy");
    setStatus(
      copied
        ? "index.json をコピーしました"
        : "index.json のコピーに失敗しました (ブラウザがコピーを拒否しました)"
    );
  } catch (e) {
    setStatus(`index.json のコピーに失敗しました: ${failureDetail(e)}`);
  } finally {
    if (ta.parentNode) ta.parentNode.removeChild(ta);
  }
};
</script>
</body>
</html>
